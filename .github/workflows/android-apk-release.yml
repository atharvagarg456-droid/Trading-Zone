name: Build & Publish Android APK & Apple Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept All Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null || true
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK & Prepare GitHub Release Files
        run: gradle prepareGithubApk --no-daemon --stacktrace

      - name: Upload APK Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Trading-Zone-APK
          path: |
            Trading-Zone.apk
            releases/Trading-Zone.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3.5-latest
          name: "Trading Zone Official Android APK & Apple Web App"
          body: |
            ### 📲 Download Trading Zone
            - **Android Direct APK**: Download `Trading-Zone.apk` attached below.
            - **Apple iPhone / iPad Safari Web App**: Open `https://atharvagarg456-droid.github.io/TradingCoLTD/` in Safari and tap **Share → Add to Home Screen**.
          prerelease: false
          files: |
            Trading-Zone.apk
            releases/Trading-Zone.apk

      - name: Commit & Push Updated APK to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Trading-Zone.apk releases/Trading-Zone.apk docs/Trading-Zone.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore: publish built Trading-Zone.apk [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi
